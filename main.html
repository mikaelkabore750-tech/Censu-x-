<!-- main.html -->
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premier Portfolio de Mikael-Dev</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0a0a0a;
            color: #fff;
            font-family: 'Courier New', monospace;
            overflow: hidden;
        }
        #particles {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
        }
        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            text-align: center;
        }
        .profile-img {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            border: 2px solid #00ff00;
            margin-bottom: 20px;
            cursor: pointer;
        }
        .buttons {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
        }
        .button {
            background-color: #1a1a1a;
            border: 1px solid #00ff00;
            color: #00ff00;
            padding: 15px 30px;
            text-decoration: none;
            font-size: 18px;
            border-radius: 5px;
            position: relative;
            overflow: hidden;
            transition: all 0.3s;
        }
        .button:hover {
            background-color: #00ff00;
            color: #0a0a0a;
            box-shadow: 0 0 20px #00ff00;
        }
        .button::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(0,255,0,0.2), transparent);
            transition: all 0.5s;
        }
        .button:hover::before {
            top: 0;
            left: 0;
        }
        audio {
            display: none;
        }
    </style>
</head>
<body>
    <div id="particles"></div>
    <div class="container">
        <img src="mikael-x.png" alt="Mikael-X" class="profile-img" onclick="playAudio()">
        <h1>Premier Portfolio de Mikael-Dev</h1>
        <p>Tech & Maths Enthusiast</p>
        <div class="buttons">
            <a href="bot.html" class="button">BOTS</a>
            <a href="chearch-song.html" class="button">SONG</a>
            <a href="contact.html" class="button">CONTACT</a>
            <a href="stats.html" class="button">STATS</a>
            <a href="temp-email.html" class="button">TEMP-EMAIL</a>
            <a href="tiktok.html" class="button">TIKTOK</a>
            <a href="x-panel.html" class="button">X-PANEL</a>
        </div>
    </div>
    <audio id="audio" src="mikael-x.mp3"></audio>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/particles.js/2.0.0/particles.min.js"></script>
    <script>
        particlesJS('particles', {
            particles: {
                number: { value: 80, density: { enable: true, value_area: 800 } },
                color: { value: '#00ff00' },
                shape: { type: 'circle' },
                opacity: { value: 0.5, random: false },
                size: { value: 3, random: true },
                line_linked: { enable: true, distance: 150, color: '#00ff00', opacity: 0.4, width: 1 },
                move: { enable: true, speed: 6, direction: 'none', random: false, straight: false, out_mode: 'out', bounce: false }
            },
            interactivity: { detect_on: 'canvas', events: { onhover: { enable: true, mode: 'repulse' }, onclick: { enable: true, mode: 'push' }, resize: true } },
            retina_detect: true
        });

        function playAudio() {
            document.getElementById('audio').play();
        }
    </script>
</body>
</html>
