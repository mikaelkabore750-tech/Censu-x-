<!doctype html>

<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Search Song — Mikael-Dev</title>
  <link rel="icon" href="mikael-x.png" />
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:Inter,system-ui;background:#05060a;color:#e2e8f0;min-height:100vh;overflow-x:hidden}header{padding:20px;display:flex;align-items:center;gap:14px}
header img{width:52px;height:52px;border-radius:10px;border:2px solid rgba(255,255,255,.05)}
header h1{font-size:22px}
header a{margin-left:auto;color:#7c3aed;text-decoration:none;font-weight:600}

.wrap{width:min(900px,92%);margin:auto;padding-top:20px}
h2{color:#7c3aed;font-size:30px;text-shadow:0 0 14px rgba(124,58,237,.5)}
p.subtitle{color:#94a3b8;margin-bottom:26px}

.search-box{display:flex;gap:10px;margin-bottom:20px}
input{flex:1;background:#0f1117;border:1px solid #1f2937;padding:14px;border-radius:12px;color:#e5e7eb;font-size:15px}
button{background:linear-gradient(135deg,#0ea5e9,#7c3aed);border:none;padding:14px 20px;border-radius:12px;font-weight:600;color:white;cursor:pointer}

.result-card{margin-top:20px;padding:20px;border-radius:16px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.05);display:none}
.thumb{width:180px;height:180px;border-radius:12px;object-fit:cover;margin-bottom:14px}
.song-title{font-size:20px;margin-bottom:6px}
.artist{color:#a1a1aa;font-size:14px;margin-bottom:12px}

.download{margin-top:12px;background:linear-gradient(135deg,#7c3aed,#0ea5e9);border:none;padding:12px 18px;border-radius:12px;color:white;font-weight:600;cursor:pointer}

footer{text-align:center;color:#64748b;margin-top:40px;padding:20px;font-size:13px}
footer a{color:#7c3aed;text-decoration:none}

canvas#p{position:fixed;inset:0;z-index:-1}

  </style>
</head>
<body>
  <canvas id="p"></canvas>  <header>
    <img src="mikael-x.png" alt="logo">
    <h1>Search Song</h1>
    <a href="main.html">Retour</a>
  </header>  <div class="wrap">
    <h2>Rechercher un Song</h2>
    <p class="subtitle">Cherche une musique globale via YouTube / Spotify</p><div class="search-box">
  <input id="query" type="text" placeholder="Nom du song…" />
  <button onclick="searchSong()">Rechercher</button>
</div>

<div class="result-card" id="result">
  <img id="thumb" class="thumb" src="" alt="thumbnail">
  <div class="song-title" id="title"></div>
  <div class="artist" id="artist"></div>
  <button class="download" id="dlBtn">Télécharger</button>
</div>

  </div>  <footer>
    <p>Retour au <a href="main.html">Portfolio</a></p>
  </footer><script>
function searchSong(){
  const q=document.getElementById('query').value.trim();
  if(!q) return alert('Entre un nom');

  // Démo — remplacer ici par une future vraie API
  document.getElementById('result').style.display='block';
  document.getElementById('thumb').src='https://i.ytimg.com/vi/q6EoRBvdVPQ/hqdefault.jpg';
  document.getElementById('title').textContent='Song Exemple — '+q;
  document.getElementById('artist').textContent='Artiste Démonstration';
  document.getElementById('dlBtn').onclick=()=>{
    alert('Téléchargement fictif — API à connecter');
  };
}

// Particules
const c=document.getElementById('p');const x=c.getContext('2d');let w=c.width=innerWidth;let h=c.height=innerHeight;
const pts=[];const cols=['#7c3aed','#0ea5e9','#06b6d4'];
function R(a,b){return Math.random()*(b-a)+a}
for(let i=0;i<110;i++) pts.push({x:R(0,w),y:R(0,h),vx:R(-.3,.3),vy:R(-.4,.4),r:R(1,3),c:cols[Math.floor(R(0,cols.length))]});
function draw(){x.clearRect(0,0,w,h);for(const p of pts){p.x+=p.vx;p.y+=p.vy;if(p.x<0)p.x=w;if(p.x>w)p.x=0;if(p.y<0)p.y=h;if(p.y>h)p.y=0;x.beginPath();x.arc(p.x,p.y,p.r,0,Math.PI*2);x.fillStyle=p.c;x.globalAlpha=.85;x.fill();}requestAnimationFrame(draw);}draw();
onresize=()=>{w=c.width=innerWidth;h=c.height=innerHeight};
</script></body>
</html>
