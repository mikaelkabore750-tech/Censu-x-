<!DOCTYPE html><html lang="fr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Temp Email | Mikael-Dev</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #0a0a0f;
            color: #fff;
            font-family: "Poppins", sans-serif;
            text-align: center;
        }h1 {
        margin-top: 40px;
        font-size: 2.4rem;
        font-weight: 700;
        letter-spacing: 2px;
    }

    .container {
        width: 90%;
        max-width: 700px;
        margin: auto;
        margin-top: 40px;
        padding: 20px;
        background: rgba(255,255,255,0.05);
        border-radius: 20px;
        backdrop-filter: blur(10px);
        box-shadow: 0 0 20px rgba(0,255,255,0.2);
    }

    button {
        margin: 12px;
        padding: 12px 22px;
        border: none;
        outline: none;
        border-radius: 14px;
        font-size: 1.1rem;
        cursor: pointer;
        transition: 0.25s;
        background: #00e0ff;
        color: #000;
        font-weight: 600;
    }

    button:hover {
        transform: scale(1.06);
        background: #00aab8;
    }

    #emailDisplay {
        margin-top: 20px;
        font-size: 1.4rem;
        font-weight: 600;
        color: #00e0ff;
    }

    #inboxDisplay {
        margin-top: 30px;
        text-align: left;
    }

    .messageBox {
        padding: 15px;
        border-radius: 10px;
        margin-bottom: 15px;
        background: rgba(255,255,255,0.08);
        border-left: 4px solid #00e0ff;
    }

    .back-btn {
        position: fixed;
        left: 20px;
        top: 20px;
        padding: 10px 18px;
        background: #fff;
        color: #000;
        border-radius: 12px;
        font-weight: 700;
        cursor: pointer;
    }
</style>

</head>
<body><button class="back-btn" onclick="window.location='main.html'">⟵ Back</button>

<h1>Temp Email Generator</h1>

<div class="container">
    <button onclick="generateEmail()">Generate Email</button>
    <button onclick="getInbox()">Get Inbox</button>

    <div id="emailDisplay"></div>
    <div id="inboxDisplay"></div>
</div>

<script src="temp-email.js"></script>

</body>
</html>
