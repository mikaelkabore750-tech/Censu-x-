<!DOCTYPE html><html lang="en">
<head>
  <meta charset="UTF-8" />

  <style>
    body {
      margin: 0;

      font-family: "Poppins", sans-serif;
      background: #020409;

      overflow-x: hidden;
    }canvas#bg {
  position: fixed;

}

.container {
  text-align: center;

}

h1 {
  font-size: 3rem;

}

p {
  opacity: 0.8;
}

input {
  width: 80%;

}

.btn {

video {

</head>
<body><canvas id="bg"></canvas> <button class="back-btn" onclick="window.location='main.html'">← Main</button>

<div class="container">
  <h1>TIKTOK DOWNLOADER</h1>
  <p>Télécharge une vidéo TikTok sans filigrane</p>  <input type="text" id="tiktokURL" placeholder="Colle le lien TikTok ici...">
  <br>
  <button class="btn" onclick="downloadTikTok()">Télécharger</button>  <div id="preview" class="preview"></div>
</div><script src="tiktok.js"></script><script>
// Particules fond
const canvas = document.getElementById("bg");
const ctx = canvas.getContext("2d");
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

let particles = [];

class Particle {
  constructor() {
    this.x = Math.random() * canvas.width;
    this.y = Math.random() * canvas.height;
    this.size = Math.random() * 2;
    this.speedX = (Math.random() - 0.5) * 0.5;
    this.speedY = (Math.random() - 0.5) * 0.5;
  }
  update() {
    this.x += this.speedX;
    this.y += this.speedY;
    if (this.x < 0 || this.x > canvas.width) this.speedX *= -1;
    if (this.y < 0 || this.y > canvas.height) this.speedY *= -1;
  }
  draw() {
    ctx.fillStyle = "#00d5ff";
    ctx.fillRect(this.x, this.y, this.size, this.size);
  }
}

function animate() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  particles.forEach(p => { p.update(); p.draw(); });
  requestAnimationFrame(animate);
}

for (let i = 0; i < 130; i++) particles.push(new Particle());
animate();

window.onresize = () => {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
};
</script></body>
</html>
